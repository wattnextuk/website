<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Watt Next</title>
<meta name="description" content="Watt Next Ltd: a new game studio. Something new is coming.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230f1b2d'/%3E%3Cpath d='M18 4 8 18h7l-2 10 10-14h-7z' fill='%23f5b638'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root { --bg:#0f1b2d; --ink:#f4f1ea; --muted:#9aa6b8; --accent:#f5b638; }
  * { box-sizing:border-box; margin:0; }
  html, body { height:100%; }
  body {
    background: radial-gradient(1200px 600px at 80% -10%, #1d3354 0%, transparent 60%), var(--bg);
    color:var(--ink); font-family:Inter, system-ui, sans-serif; line-height:1.6;
    display:flex; flex-direction:column; min-height:100vh; padding:0 16px;
  }
  main { flex:1; display:flex; flex-direction:column; justify-content:center; max-width:720px; width:100%; margin:0 auto; padding:64px 0; }
  .mark { display:flex; align-items:center; gap:12px; font-family:"Space Grotesk", sans-serif; font-weight:700; font-size:1.4rem; letter-spacing:-0.01em; }
  .mark svg { width:36px; height:36px; }
  h1 { font-family:"Space Grotesk", sans-serif; font-weight:700; font-size:clamp(2.4rem, 7vw, 4.2rem); line-height:1.05; letter-spacing:-0.03em; margin:56px 0 20px; }
  h1 span { color:var(--accent); }
  p.lede { color:var(--muted); font-size:1.15rem; max-width:34em; }
  a.btn { align-self:flex-start; display:inline-block; margin-top:36px; padding:12px 22px; border:1px solid var(--accent); color:var(--accent); border-radius:999px; text-decoration:none; font-weight:500; transition:background .2s, color .2s; }
  a.btn:hover, a.btn:focus-visible { background:var(--accent); color:var(--bg); }
  footer { max-width:720px; width:100%; margin:0 auto; padding:24px 0 32px; border-top:1px solid #23324a; color:var(--muted); font-size:.8rem; }
</style>
</head>
<body>
<main>
  <div class="mark">
    <svg viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="7" fill="#1d3354"/><path d="M18 4 8 18h7l-2 10 10-14h-7z" fill="#f5b638"/></svg>
    Watt Next
  </div>
  <h1>Something new<br>is <span>coming.</span></h1>
  <p class="lede">Watt Next is a new games company. More soon.</p>
  <a class="btn" href="mailto:hello@wattnext.uk">hello@wattnext.uk</a>
</main>
<footer>
  Watt Next Ltd is a private company limited by shares, registered in England and Wales, company number 17531344.<br>
  Registered office: 5th Floor, 167–169 Great Portland Street, London W1W 5PF.
</footer>
</body>
</html>
